<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>心象牌卡 Card Oracle｜植物・動物・食物・山水</title>
<meta name="description" content="線上心理投射牌卡：憑直覺選一張牌，看看背後的意涵。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <h1>🎴 心象牌卡</h1>
  <p class="sub">先看圖卡，憑直覺選一張，翻到背面看它映照出你的內心</p>
  <section class="qrhome" aria-label="掃描進入">
    <div id="qrhome" class="qrbox" role="img" aria-label="網站 QR Code"></div>
    <div class="qrtxt">
      <b>📱 掃描 QR Code，立即進入</b>
      <span id="siteurl"></span>
      <div class="qracts"><button id="btnQRdl2">下載 QR 圖片</button><button id="btnQRprint2">列印海報</button></div>
    </div>
  </section>
  <nav id="decks" class="tabs" aria-label="牌組"></nav>
</header>

<main>
  <section class="bar">
    <div class="seg" role="tablist">
      <button id="modeDraw" class="on">🔮 抽牌</button>
      <button id="modeBrowse">📖 瀏覽圖鑑</button>
    </div>
    <div class="acts">
      <button id="btnRandom" class="pri">✨ 幫我抽一張</button>
      <button id="btnShuffle">🔀 重新洗牌</button>
      <button id="btnHistory">🕘 我的紀錄</button>
      <button id="btnQR">📱 QR Code</button>
    </div>
  </section>
  <p id="intro" class="intro"></p>
  <div id="grid" class="grid"></div>
</main>

<footer>
  <p>本牌卡為自我覺察與反思的輔助工具，屬「投射式」趣味與對話引導，<b>並非心理診斷或專業評估</b>。<br>
  <span id="count"></span>想新增牌組？見 README。<br>插圖：<a href="https://github.com/jdecked/twemoji" target="_blank" rel="noopener">Twemoji</a>（CC-BY 4.0）。</p>
</footer>

<div id="modal" class="modal" hidden>
  <div class="cardwrap">
    <div class="stage"><div id="flip" class="flip"><div class="face front" id="front"></div><div class="face back2" id="backface"></div></div></div>
    <p class="hint">點卡片可再翻面</p>
    <div class="sheet-acts">
      <button id="btnCopy">📋 複製結果</button>
      <button id="btnAgain" class="pri">再抽一張</button>
      <button id="close">關閉</button>
    </div>
  </div>
</div>

<div id="hist" class="modal" hidden>
  <div class="sheet">
    <button id="closeHist" class="x" aria-label="關閉">✕</button>
    <h2>🕘 我的紀錄</h2>
    <div id="histList"></div>
    <div class="sheet-acts"><button id="btnClear">清除紀錄</button></div>
  </div>
</div>

<div id="qrm" class="modal" hidden>
  <div class="sheet" style="text-align:center">
    <button id="closeQR" class="x" aria-label="關閉">✕</button>
    <h2>📱 掃描進入心象牌卡</h2>
    <div id="qrbox" class="qrbox big" style="margin:12px auto"></div>
    <p id="qrurl" style="word-break:break-all;color:#77747f;font-size:13px"></p>
    <div class="sheet-acts"><button id="btnQRdl" class="pri">下載 QR 圖片</button><button id="btnQRprint">列印</button></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<!-- 牌組資料：新增牌組 = 新增一個 data/xxx.js，並在這裡加一行 script -->
<script src="data/_lib.js"></script>
<script src="data/plants.js"></script>
<script src="data/animals.js"></script>
<script src="data/food.js"></script>
<script src="data/landscape.js"></script>
<script src="data/colors.js"></script>
<script src="data/shapes.js"></script>
<script src="data/house.js"></script>
<script src="data/dreams.js"></script>
<script src="data/weather.js"></script>
<script src="data/vehicles.js"></script>
<script src="data/objects.js"></script>
<script src="data/archetypes.js"></script>
<script src="data/scenes.js"></script>
<script src="data/music.js"></script>
<script src="data/emotions.js"></script>
<script src="data/values.js"></script>
<script src="data/strengths.js"></script>
<script src="data/careers.js"></script>
<script src="data/body.js"></script>
<script src="data/gestures.js"></script>
<script src="data/childhood.js"></script>
<script src="data/fairytales.js"></script>
<script src="data/sports.js"></script>
<script src="data/selfcare.js"></script>
<script src="data/emoji.js"></script>
<script src="data/qr.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
