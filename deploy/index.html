<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>心象牌卡 Card Oracle｜植物・動物・食物・山水</title>
<meta name="description" content="線上心理投射牌卡：憑直覺選一張牌，看看背後的意涵。">
<style>
:root{--bg:#f6f4ef;--ink:#2b2a33;--mute:#77747f;--pri:#5b6b4f;--pri2:#7d8f6e;--card:#fff;--line:#e4e0d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:999px}
button:hover{border-color:var(--pri2)}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.top{text-align:center;padding:22px 16px 6px}
.top h1{margin:0;font-size:28px;letter-spacing:2px}
.sub{margin:4px 0 14px;color:var(--mute)}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tabs button[disabled]{opacity:.5;cursor:not-allowed}
.tabs small{font-size:11px;margin-left:4px}
main{max-width:1000px;margin:0 auto;padding:12px 14px 30px}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin:8px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;border-radius:0}
.seg button.on{background:var(--pri2);color:#fff}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.intro{text-align:center;color:var(--mute);margin:10px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.c{position:relative;aspect-ratio:3/4.2;border-radius:14px;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 2px 6px #0002;overflow:hidden;border:0;padding:0}
.c:hover{transform:translateY(-4px) rotate(-1deg);box-shadow:0 8px 18px #0003}
.c.back,.face.back{background:
  radial-gradient(circle at 50% 50%,#ffffff22 0 18%,transparent 19%),
  repeating-linear-gradient(45deg,#3f4b38 0 8px,#4a5842 8px 16px);
  border:3px solid #e9e2c9;border-radius:14px}
.c.back::after,.face.back::after{content:"🌙";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;opacity:.85}
.c.picked{outline:3px solid #e0b64a}
.cf{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;text-shadow:0 1px 3px #0005;border-radius:14px}
.cf .em{font-size:44px;filter:drop-shadow(0 2px 3px #0004)}
.cf .nm{font-weight:700;letter-spacing:1px}
.cf .en{font-size:11px;opacity:.85}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px;z-index:10;overflow:auto}
.modal[hidden]{display:none}
.sheet{position:relative;background:var(--card);border-radius:20px;max-width:520px;width:100%;max-height:94vh;overflow:auto;padding:22px 20px 18px}
.x{position:absolute;right:12px;top:10px;border:0;background:transparent;font-size:18px}
.stage{perspective:900px;display:flex;justify-content:center;margin:6px 0 14px}
.flip{position:relative;width:170px;aspect-ratio:3/4.2;transition:transform .8s;transform-style:preserve-3d}
.flip.open{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;box-shadow:0 8px 22px #0004}
.face.front{transform:rotateY(180deg)}
.face.front .cf .em{font-size:64px}.face.front .cf .nm{font-size:22px}
.detail{opacity:0;transform:translateY(8px);transition:all .5s .5s}
.detail.show{opacity:1;transform:none}
.detail h2{margin:0 0 2px;font-size:22px}
.detail .ttl{color:var(--pri);font-weight:700;margin-bottom:10px}
.detail p{margin:6px 0}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;margin-right:6px;color:#fff}
.t-l{background:#6a9a5b}.t-s{background:#b07a5b}.t-a{background:#6a79a8}
.sheet-acts{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
#histList .h{border-bottom:1px solid var(--line);padding:8px 0;font-size:14px}
#histList .h b{margin-right:6px}#histList .h span{color:var(--mute);font-size:12px}
footer{max-width:760px;margin:0 auto;padding:6px 16px 30px;color:var(--mute);font-size:12px;text-align:center}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:999px;z-index:20}
.toast[hidden]{display:none}
@media(max-width:480px){.grid{grid-template-columns:repeat(3,1fr);gap:8px}.cf .em{font-size:34px}}
@media print{body.printqr>*:not(#qrm){display:none!important}body.printqr #qrm{position:static;background:#fff}body.printqr .x,body.printqr .sheet-acts{display:none}}

/* v2：圖卡正面、翻到背面看意涵 */
.tabs{gap:6px}.tabs button{padding:6px 11px;font-size:14px}
.cardwrap{width:100%;max-width:340px;margin:auto;text-align:center}
.stage{perspective:1200px;display:flex;justify-content:center;margin:0 0 8px}
.flip{position:relative;width:min(310px,84vw);height:min(440px,64vh);cursor:pointer;transition:transform .8s;transform-style:preserve-3d}
.flip.open{transform:rotateY(180deg)}
.face.front{transform:none}
.face.back2{transform:rotateY(180deg);background:#fffdf6;border:3px solid #e9e2c9;overflow:auto}
.face .cf .em{font-size:84px}.face .cf .nm{font-size:28px}.face .cf .en{font-size:14px}
.bk{padding:16px 16px 14px;text-align:left;font-size:14px;line-height:1.6;color:#2b2a33}
.bk-h{font-size:20px;font-weight:700}.bk-h small{font-size:12px;color:#999;font-weight:400}
.bk-t{color:var(--pri);font-weight:700;margin:2px 0 8px}
.bk p{margin:6px 0}.bk .ask{background:#f1f3ee;border-radius:8px;padding:6px 8px}
.hint{color:#ffffffbb;font-size:12px;margin:2px 0 6px}
.cardwrap .sheet-acts button{background:#fff}
.cardwrap .sheet-acts button.pri{background:var(--pri)}
.c .cf{padding:2px;text-align:center}
.c .cf .nm{font-size:15px}

/* v3：精緻牌面（塔羅風外框、插圖光暈、名稱絲帶） */
.cf{container-type:inline-size;justify-content:flex-start;gap:0;padding:0;overflow:hidden;text-shadow:none}
.cf::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 20% 15%,#ffffff2e,transparent 45%),
  repeating-linear-gradient(135deg,#ffffff0a 0 2px,transparent 2px 7px);pointer-events:none}
.cf .fr{position:absolute;inset:3.5cqw;border:.5cqw solid #ffe9a8cc;border-radius:7cqw;box-shadow:inset 0 0 0 1.2cqw #00000018,0 0 0 .5cqw #00000026;pointer-events:none}
.cf.lt .fr{border-color:#00000055}
.cf .no{position:absolute;top:6.5cqw;left:0;right:0;text-align:center;font-size:6.2cqw;letter-spacing:.6cqw;opacity:.85;font-weight:600}
.cf .st{position:absolute;bottom:23cqw;left:8cqw;font-size:6cqw;opacity:.7}
.cf .st::after{content:"✦";position:absolute;left:calc(100cqw - 22cqw);top:0}
.cf .art{position:absolute;left:0;right:0;top:15cqw;height:60cqw;display:flex;align-items:center;justify-content:center}
.cf .halo{position:absolute;width:62cqw;height:62cqw;border-radius:50%;background:radial-gradient(circle,#ffffffbb 0,#ffffff55 42%,transparent 70%);filter:blur(1px)}
.cf.lt .halo{background:radial-gradient(circle,#ffffffaa 0,#ffffff44 45%,transparent 70%)}
.cf .tw{position:relative;width:46cqw;height:46cqw;filter:drop-shadow(0 1.6cqw 2cqw #0000004d);transition:transform .3s}
.cf .fb{position:relative;font-size:38cqw;line-height:1;filter:drop-shadow(0 1.6cqw 2cqw #0000004d)}
.c:hover .tw{transform:scale(1.08) rotate(-3deg)}
.cf .rib{position:absolute;left:7cqw;right:7cqw;bottom:8cqw;padding:2.2cqw 2cqw 2cqw;text-align:center;border-radius:4cqw;background:linear-gradient(180deg,#00000040,#00000066);border:.4cqw solid #ffe9a866;backdrop-filter:blur(2px)}
.cf.lt .rib{background:linear-gradient(180deg,#ffffffaa,#ffffffcc);border-color:#00000022}
.cf .nm{font-size:10.5cqw;font-weight:800;letter-spacing:.8cqw;line-height:1.15;color:#fff;text-shadow:0 .5cqw 1cqw #0006}
.cf .en{font-size:5.4cqw;opacity:.9;letter-spacing:.3cqw;color:#fff;margin-top:.4cqw}
.cf.lt .nm,.cf.lt .en{color:inherit;text-shadow:none}
.c{box-shadow:0 3px 8px #0003,0 0 0 1px #0002;border-radius:3.5cqw;border-radius:14px;overflow:hidden}
.c::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,#ffffff55 50%,transparent 60%);transform:translateX(-120%);transition:transform .6s;pointer-events:none}
.c:hover::after{transform:translateX(120%)}
.face.front,.face.back2{border-radius:18px}
.face .cf{border-radius:18px}
.face.front{overflow:hidden;border:0}
/* 背面 */
.bk-h{display:flex;align-items:center;gap:8px}
.tw.sm{width:34px;height:34px;flex:none}
.bk-h .fb{font-size:28px}
.orn{text-align:center;color:#c9a64a;letter-spacing:6px;font-size:11px;margin:-2px 0 6px}
.face.back2{background:
  linear-gradient(#fffdf6,#fffdf6) padding-box,
  linear-gradient(135deg,#e9d9a6,#c9a64a,#e9d9a6) border-box;border:3px solid transparent}
@media(max-width:480px){.cf .no{display:none}}

.tabs{flex-direction:column;align-items:center;gap:6px;max-width:960px;margin:0 auto}
.grp{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.glab{font-size:12px;color:var(--mute);margin-right:2px;white-space:nowrap}
.tabs button{padding:5px 10px;font-size:13.5px}

/* v3.1 版面微調 */
.cf .art{top:11cqw;height:84cqw}
.cf .halo{width:74cqw;height:74cqw}
.cf .tw{width:58cqw;height:58cqw}
.cf .fb{font-size:48cqw}
.glab{flex-basis:100%;text-align:center;margin:4px 0 0}
.hint{text-shadow:0 1px 3px #000a}
.bk{position:relative;font-size:15.5px;line-height:1.7;min-height:100%}
.bk>*{position:relative;z-index:1}
.bk .wm{position:absolute;right:-18px;bottom:-14px;width:170px;height:170px;opacity:.09;z-index:0}
.bk .wm img{width:100%;height:100%;filter:grayscale(.3)}
.bk-h{font-size:22px}
.tw.sm{width:38px;height:38px}
.cf .halo{background:radial-gradient(circle,#fffffff0 0,#ffffffa0 38%,#ffffff30 62%,transparent 72%)}

/* 首頁 QR */
.qrhome{display:flex;gap:14px;align-items:center;justify-content:center;max-width:460px;margin:0 auto 14px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px #0001;text-align:left}
.qrbox{width:116px;height:116px;flex:none;line-height:0}
.qrbox svg{width:100%;height:100%;display:block;border-radius:6px}
.qrbox.big{width:240px;height:240px}
.qrtxt{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);min-width:0}
.qrtxt b{font-size:15px;color:var(--ink)}
.qrtxt span{word-break:break-all;font-size:12px}
.qracts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.qracts button{padding:4px 10px;font-size:12.5px}
@media(max-width:380px){.qrhome{flex-direction:column;text-align:center}.qracts{justify-content:center}}

/* ===== v4：立體化 ===== */
body{background:radial-gradient(ellipse at 50% -10%,#fffdf5 0,#f3efe4 55%,#e9e3d3 100%) fixed}
.top h1{font-size:30px;text-shadow:0 1px 0 #fff,0 3px 0 #d9d2bd,0 6px 8px #0002;display:flex;align-items:center;justify-content:center;gap:8px}
img.ic{width:1.25em;height:1.25em;vertical-align:-.22em;margin-right:.3em;filter:drop-shadow(0 1px 1.5px #0003)}
h1 img.ic{width:1.1em;height:1.1em;margin:0}
/* 3D 按鈕 */
button{background:linear-gradient(180deg,#fff 0,#f4f0e6 100%);border:1px solid #d8d1bd;border-bottom-width:3px;border-bottom-color:#c9c1a8;
  box-shadow:0 2px 3px #0002,inset 0 1px 0 #fff;transition:transform .12s,box-shadow .12s,border-color .12s}
button:hover{transform:translateY(-1px);box-shadow:0 5px 8px #0002,inset 0 1px 0 #fff}
button:active{transform:translateY(2px);border-bottom-width:1px;box-shadow:inset 0 2px 4px #0003}
button.pri,.tabs button.on,.seg button.on{background:linear-gradient(180deg,#7d9a68 0,#5b6b4f 100%);color:#fff;border-color:#4a5a40;border-bottom-color:#38452f;
  box-shadow:0 3px 5px #0003,inset 0 1px 0 #ffffff55}
.seg{box-shadow:inset 0 2px 4px #0002,0 1px 0 #fff;border-radius:999px;background:#ece7d8}
.seg button{background:transparent;border:0;box-shadow:none;transform:none}
.seg button.on{box-shadow:0 2px 4px #0003,inset 0 1px 0 #ffffff55;border-radius:999px}
.qrhome{box-shadow:0 10px 22px #0002,0 1px 0 #fff inset;border-bottom:3px solid #d8d1bd}
.qrbox svg{box-shadow:0 3px 8px #0003}
/* 3D 卡片 */
.grid{perspective:1100px;gap:16px}
.c{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;
  transition:transform .18s ease-out,box-shadow .25s;border-radius:16px;
  box-shadow:0 1px 0 #ffffff80 inset,0 5px 0 #00000026,0 5px 0 1px #0000000d,0 14px 20px -4px #00000040,0 28px 34px -12px #00000030}
.c:hover{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-6px) scale(1.03);
  box-shadow:0 1px 0 #ffffff80 inset,0 9px 0 #00000026,0 22px 30px -6px #00000050,0 40px 50px -16px #00000040}
.c:active{transform:perspective(700px) translateY(0) scale(.98)}
.c::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .2s;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),#ffffffaa 0,#ffffff00 48%)}
.c:hover::before{opacity:.9}
.c .art{transform:translate(var(--ax,0),var(--ay,0));transition:transform .18s ease-out}
.cf .tw{filter:drop-shadow(0 .8cqw 0 #00000026) drop-shadow(0 3cqw 3.5cqw #0000005c) drop-shadow(0 0 1cqw #ffffff66)}
.cf .halo{box-shadow:inset 0 -2cqw 5cqw #00000022}
.cf .rib{box-shadow:0 1.6cqw 3cqw #0000004d,inset 0 .5cqw 0 #ffffff44}
.cf .fr{box-shadow:inset 0 0 0 1.2cqw #00000018,0 0 0 .5cqw #00000026,inset 0 2cqw 4cqw #ffffff22}
/* 彈窗牌：厚邊與陰影 */
.face{box-shadow:0 2px 0 #ffffff80 inset,0 10px 0 #0000002e,0 24px 40px #0000006b}
.flip{filter:drop-shadow(0 18px 18px #0005)}
.face.back2{box-shadow:0 2px 0 #fff inset,0 8px 0 #c9b97d,0 26px 40px #0000006b}
@media(hover:none){.c:hover{transform:none}}

/* v4.1：分頁放大 2 倍 */
.tabs{gap:14px;max-width:1280px}
.grp{gap:12px}
.tabs button{font-size:27px;padding:10px 22px;border-bottom-width:4px;border-radius:999px}
.glab{font-size:24px;margin:10px 0 2px}
.tabs img.ic{width:1.3em;height:1.3em}
@media(max-width:700px){.tabs button{font-size:19px;padding:8px 14px}.glab{font-size:17px}.grp{gap:8px}}

</style>
</head>
<body>
<header class="top">
  <h1>🎴 心象牌卡</h1>
  <p class="sub">先看圖卡，憑直覺選一張，翻到背面看它映照出你的內心</p>
  <section class="qrhome" aria-label="掃描進入">
    <div id="qrhome" class="qrbox" role="img" aria-label="網站 QR Code"></div>
    <div class="qrtxt">
      <b>📱 掃描 QR Code，立即進入</b>
      <span id="siteurl"></span>
      <div class="qracts"><button id="btnQRdl2">下載 QR 圖片</button><button id="btnQRprint2">列印海報</button></div>
    </div>
  </section>
  <nav id="decks" class="tabs" aria-label="牌組"></nav>
</header>

<main>
  <section class="bar">
    <div class="seg" role="tablist">
      <button id="modeDraw" class="on">🔮 抽牌</button>
      <button id="modeBrowse">📖 瀏覽圖鑑</button>
    </div>
    <div class="acts">
      <button id="btnRandom" class="pri">✨ 幫我抽一張</button>
      <button id="btnShuffle">🔀 重新洗牌</button>
      <button id="btnHistory">🕘 我的紀錄</button>
      <button id="btnQR">📱 QR Code</button>
    </div>
  </section>
  <p id="intro" class="intro"></p>
  <div id="grid" class="grid"></div>
</main>

<footer>
  <p>本牌卡為自我覺察與反思的輔助工具，屬「投射式」趣味與對話引導，<b>並非心理診斷或專業評估</b>。<br>
  <span id="count"></span>想新增牌組？見 README。<br>插圖：<a href="https://github.com/jdecked/twemoji" target="_blank" rel="noopener">Twemoji</a>（CC-BY 4.0）。</p>
</footer>

<div id="modal" class="modal" hidden>
  <div class="cardwrap">
    <div class="stage"><div id="flip" class="flip"><div class="face front" id="front"></div><div class="face back2" id="backface"></div></div></div>
    <p class="hint">點卡片可再翻面</p>
    <div class="sheet-acts">
      <button id="btnCopy">📋 複製結果</button>
      <button id="btnAgain" class="pri">再抽一張</button>
      <button id="close">關閉</button>
    </div>
  </div>
</div>

<div id="hist" class="modal" hidden>
  <div class="sheet">
    <button id="closeHist" class="x" aria-label="關閉">✕</button>
    <h2>🕘 我的紀錄</h2>
    <div id="histList"></div>
    <div class="sheet-acts"><button id="btnClear">清除紀錄</button></div>
  </div>
</div>

<div id="qrm" class="modal" hidden>
  <div class="sheet" style="text-align:center">
    <button id="closeQR" class="x" aria-label="關閉">✕</button>
    <h2>📱 掃描進入心象牌卡</h2>
    <div id="qrbox" class="qrbox big" style="margin:12px auto"></div>
    <p id="qrurl" style="word-break:break-all;color:#77747f;font-size:13px"></p>
    <div class="sheet-acts"><button id="btnQRdl" class="pri">下載 QR 圖片</button><button id="btnQRprint">列印</button></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<!-- 牌組資料：新增牌組 = 新增一個 data/xxx.js，並在這裡加一行 script -->
<script>
/* 共用建牌工具：mkDeck(id,名稱,emoji,導語,前綴,rows)
   rows 每列：[名稱,英文,emoji,色相,意象,意涵,光明面,陰影面,自我提問,(選填)背景CSS,(選填)文字色] */
window.DECKS = window.DECKS || {};
window.mkDeck = function (id, name, emoji, intro, prefix, rows) {
  window.DECKS[id] = { id: id, name: name, emoji: emoji, intro: intro,
    cards: rows.map(function (a, i) {
      return { id: prefix + (i + 1), name: a[0], en: a[1], emoji: a[2], hue: a[3], title: a[4],
        meaning: a[5], light: a[6], shadow: a[7], ask: a[8], bg: a[9] || "", fg: a[10] || "" };
    }) };
};

</script>
<script>
/* 植物牌組：新增/修改牌卡只需編輯此檔。欄位：
   id 唯一編號 / name 名稱 / en 英文 / emoji 牌面圖 / hue 牌面色相(0-360)
   title 一句話意象 / meaning 背後意涵 / light 光明面(優勢) / shadow 陰影面(提醒) / ask 自我提問 */
window.DECKS = window.DECKS || {};
window.DECKS.plants = {
  id: "plants", name: "植物牌組", emoji: "🌿",
  intro: "請深呼吸，憑直覺挑一張最吸引你的牌——先不要想原因。翻開後，看看它對你說了什麼。",
  cards: [
    { id:"p01", name:"玫瑰", en:"Rose", emoji:"🌹", hue:350,
      title:"帶刺的熱愛",

    return '<img class="tw ' + (cls || "") + '" src="' + imgCache[k] + '" alt="' + c.emoji + '" draggable="false">';
  }
  // 把文字開頭的 emoji 換成內嵌向量插圖，確保各裝置顯示一致（不再出現缺字方框）
  var LEAD = /^(\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic}\uFE0F?)*)\s*/u;
  function emojify(el) {
    if (!el) return;
    var node = el.firstChild;
    while (node && node.nodeType !== 3) node = node.nextSibling;
    if (!node) return;
    var m = LEAD.exec(node.nodeValue); if (!m) return;
    var k = twKey(m[1]), svg = window.TWSVG && window.TWSVG[k]; if (!svg) return;
    if (!imgCache[k]) imgCache[k] = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    var img = document.createElement("img"); img.className = "ic"; img.src = imgCache[k]; img.alt = m[1]; img.draggable = false;
    node.nodeValue = node.nodeValue.slice(m[0].length);
    el.insertBefore(img, node);
  }
  function emojifyAll(sel) { Array.prototype.forEach.call(document.querySelectorAll(sel), emojify); }
  function face(c) {
    var bg = c.bg || ("radial-gradient(circle at 50% 36%,hsl(" + c.hue + ",78%,74%) 0,hsl(" + c.hue + ",68%,54%) 52%,hsl(" + ((c.hue + 25) % 360) + ",62%,30%) 100%)");
    var light = c.fg && c.fg !== "#fff";
    var num = String(c.id).replace(/\D/g, "");
    num = ("00" + num).slice(-2);
    return '<div class="cf' + (light ? " lt" : "") + '" style="background:' + bg + ';' + (c.fg ? 'color:' + c.fg : '') + '">' +
      '<i class="fr"></i><span class="no">No.' + num + '</span><span class="st">✦</span>' +
      '<div class="art"><div class="halo"></div>' + art(c) + '</div>' +
      '<div class="rib"><div class="nm">' + esc(c.name) + '</div><div class="en">' + esc(c.en) + '</div></div></div>';
  }
  function backHtml(c) {
    return '<div class="bk"><div class="wm">' + art(c) + '</div>' +
      '<div class="bk-h">' + art(c, "sm") + ' ' + esc(c.name) + ' <small>' + esc(c.en) + '</small></div>' +
      '<div class="bk-t">' + esc(c.title) + '</div><div class="orn">❖ ✦ ❖</div>' +
      '<p>' + esc(c.meaning) + '</p>' +
      '<p><span class="tag t-l">光明面</span>' + esc(c.light) + '</p>' +
      '<p><span class="tag t-s">陰影面</span>' + esc(c.shadow) + '</p>' +
      '<p class="ask"><span class="tag t-a">自我提問</span>' + esc(c.ask) + '</p></div>';
  }
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 1800);
  }

  var GROUPS = [
    ["🌿 自然萬象", ["plants", "animals", "food", "landscape"]],
    ["🔮 投射意象", ["colors", "shapes", "house", "dreams", "weather", "vehicles", "objects", "archetypes", "scenes", "music"]],
    ["🧠 心理探索", ["emotions", "values", "strengths", "careers", "body", "gestures", "childhood", "fairytales", "sports", "selfcare"]],
    ["🎲 綜合", ["mix"]]
  ];
  function renderTabs() {
    var box = $("decks"); box.innerHTML = "";
    GROUPS.forEach(function (g) {
      var row = document.createElement("div"); row.className = "grp";
      var lab = document.createElement("span"); lab.className = "glab"; lab.textContent = g[0]; row.appendChild(lab);
      g[1].forEach(function (id) {
        var d = DECKS[id]; if (!d) return;
        var b = document.createElement("button");
        b.textContent = d.emoji + " " + d.name.replace("牌組", "");
        if (state.deck === id) b.className = "on";
        b.onclick = function () { state.deck = id; reset(); renderTabs(); };
        row.appendChild(b);
      });
      box.appendChild(row);
    });
    emojifyAll('#decks .glab, #decks button');
  }

  function reset() {
    var d = DECKS[state.deck];
    state.order = shuffle(d.cards);
    $("intro").textContent = (state.mode === "draw" ? d.intro : "共 " + d.cards.length + " 張，點選任一張，翻到背面看心理意涵。") + "　（共 " + d.cards.length + " 張）";
    renderGrid();
  }

  function renderGrid() {
    var d = DECKS[state.deck], g = $("grid"); g.innerHTML = "";
    var list = state.mode === "draw" ? state.order : d.cards;
    list.forEach(function (c) {
      var el = document.createElement("button");
      el.className = "c"; el.setAttribute("aria-label", c.name);
      el.innerHTML = face(c);
      el.onclick = function () { el.classList.add("picked"); openCard(c); };
      g.appendChild(el);
    });
  }

  function openCard(c) {
    state.current = c;
    $("front").innerHTML = face(c);
    $("backface").innerHTML = backHtml(c);
    var fl = $("flip"); fl.classList.remove("open");
    $("modal").hidden = false;
    clearTimeout(state.timer);
    state.timer = setTimeout(function () { fl.classList.add("open"); }, 900);
    saveHistory(c);
  }

  function saveHistory(c) {
    try {
      var h = JSON.parse(localStorage.getItem(KEY) || "[]");
      h.unshift({ id: c.id, name: c.name, emoji: c.emoji, t: Date.now() });
      localStorage.setItem(KEY, JSON.stringify(h.slice(0, 60)));
    } catch (e) {}
  }
  function showHistory() {
    var h = []; try { h = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) {}
    $("histList").innerHTML = h.length ? h.map(function (x) {
      var dt = new Date(x.t);
      return '<div class="h"><b>' + x.emoji + ' ' + esc(x.name) + '</b><span>' + dt.toLocaleDateString() + ' ' + dt.toLocaleTimeString().slice(0, 5) + '</span></div>';
    }).join("") : '<p style="color:#999">還沒有紀錄，去抽一張吧！</p>';
    $("hist").hidden = false;
  }
  function closeModal() { clearTimeout(state.timer); $("modal").hidden = true; }

  function copyResult() {
    var c = state.current; if (!c) return;
    var txt = "【心象牌卡】我抽到：" + c.emoji + c.name + "（" + c.title + "）\n" + c.meaning +
      "\n光明面：" + c.light + "\n陰影面：" + c.shadow + "\n自我提問：" + c.ask + "\n" + location.href.split("#")[0];
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { toast("已複製，可貼給朋友 📋"); });
    else toast("此瀏覽器不支援複製");
  }

  function setMode(m) {
    state.mode = m;
    $("modeDraw").className = m === "draw" ? "on" : "";
    $("modeBrowse").className = m === "browse" ? "on" : "";
    $("btnRandom").style.display = $("btnShuffle").style.display = m === "draw" ? "" : "none";
    reset();
  }
  function pageUrl() { return location.href.split("#")[0].split("?")[0]; }

  $("modeDraw").onclick = function () { setMode("draw"); };
  $("modeBrowse").onclick = function () { setMode("browse"); };
  $("btnShuffle").onclick = function () { reset(); toast("已重新洗牌 🔀"); };
  $("btnRandom").onclick = function () {
    var c = state.order[Math.floor(Math.random() * state.order.length)]; openCard(c);
  };
  $("flip").onclick = function () { clearTimeout(state.timer); $("flip").classList.toggle("open"); };
  $("btnHistory").onclick = showHistory;
  $("close").onclick = closeModal;
  $("closeHist").onclick = function () { $("hist").hidden = true; };
  $("btnClear").onclick = function () { try { localStorage.removeItem(KEY); } catch (e) {} showHistory(); };
  $("btnCopy").onclick = copyResult;
  $("btnAgain").onclick = function () { closeModal(); if (state.mode === "draw") reset(); };
  // QR：內嵌 SVG，固定指向正式網址
  var SITE = window.SITE_URL || pageUrl();
  function qrPng(cb) {
    var img = new Image();
    img.onload = function () {
      var cv = document.createElement("canvas"); cv.width = cv.height = 800;
      var x = cv.getContext("2d"); x.imageSmoothingEnabled = false;
      x.fillStyle = "#fff"; x.fillRect(0, 0, 800, 800); x.drawImage(img, 0, 0, 800, 800);
      cb(cv.toDataURL("image/png"));
    };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(window.QR_SVG);
  }
  function downloadQR() {
    qrPng(function (url) { var a = document.createElement("a"); a.href = url; a.download = "card-oracle-qr.png"; a.click(); });
  }
  function printQR() {
    var w = window.open("", "_blank");
    if (!w) { toast("請允許彈出視窗再列印"); return; }
    w.document.write('<title>心象牌卡 QR</title><body style="font-family:sans-serif;text-align:center;padding:40px"><h1>🎴 心象牌卡</h1><p>手機掃描 QR Code，憑直覺抽一張牌</p><div style="width:340px;margin:20px auto">' + window.QR_SVG + '</div><p>' + SITE + '</p><script>setTimeout(function(){print()},300)<\/script>');
    w.document.close();
  }
  $("qrhome").innerHTML = window.QR_SVG || "";
  $("qrbox").innerHTML = window.QR_SVG || "";
  $("siteurl").textContent = SITE;
  $("btnQR").onclick = function () { $("qrurl").textContent = SITE; $("qrm").hidden = false; };
  $("closeQR").onclick = function () { $("qrm").hidden = true; };
  $("btnQRdl").onclick = downloadQR; $("btnQRdl2").onclick = downloadQR;
  $("btnQRprint").onclick = printQR; $("btnQRprint2").onclick = printQR;
  [$("modal"), $("hist"), $("qrm")].forEach(function (m) {
    m.addEventListener("click", function (e) { if (e.target === m) { clearTimeout(state.timer); m.hidden = true; } });
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeModal(); $("hist").hidden = true; $("qrm").hidden = true; }
  });

  // 立體卡面：游標傾斜與光澤（桌機）
  var gridEl = $("grid");
  gridEl.addEventListener("pointermove", function (e) {
    if (e.pointerType === "touch") return;
    var c = e.target.closest && e.target.closest(".c"); if (!c) return;
    var r = c.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    c.style.setProperty("--ry", ((px - .5) * 16).toFixed(2) + "deg");
    c.style.setProperty("--rx", ((.5 - py) * 16).toFixed(2) + "deg");
    c.style.setProperty("--ax", ((.5 - px) * 8).toFixed(1) + "px");
    c.style.setProperty("--ay", ((.5 - py) * 8).toFixed(1) + "px");
    c.style.setProperty("--gx", (px * 100).toFixed(0) + "%");
    c.style.setProperty("--gy", (py * 100).toFixed(0) + "%");
  });
  gridEl.addEventListener("pointerout", function (e) {
    var c = e.target.closest && e.target.closest(".c"); if (!c) return;
    ["--rx", "--ry", "--ax", "--ay"].forEach(function (k) { c.style.removeProperty(k); });
  });
  emojifyAll("h1, .acts button, .seg button, .qrtxt b, .sheet-acts button, #hist h2, #qrm h2");

  $("count").textContent = "共 " + (ids.length - 1) + " 大牌組、" + (all.length) + " 張牌。";
  state.deck = ids[0];
  renderTabs(); setMode("draw");
})();

</script>
</body>
</html>
